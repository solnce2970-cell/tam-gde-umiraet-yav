name: Complete all character cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-character-cards.yml'

permissions:
  contents: write

jobs:
  complete-characters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand all character cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
          '''  {
            number: "02",
            name: "Невеяна",
            role: "Девушка из Яви",
            image: "/images/characters/neveyana.webp",
            alt: "Образ персонажа Невеяна",
            text: "Тихая снаружи и гораздо сложнее, чем привыкли думать окружающие. Её путь связан с тем, кто первым сумел увидеть её целиком.",
            quote: "",
            caption: "",
          },''': '''  {
            number: "02",
            name: "Невеяна",
            role: "Та, чья нежность опаснее тьмы",
            image: "/images/characters/neveyana.webp",
            alt: "Образ персонажа Невеяна",
            text: "Тихая девушка из Яви, первая юношеская любовь Владимира. Привыкла, что в ней видят образ будущей хозяйки, а не её саму; за мягкостью скрыта собственная воля и способность сделать выбор, которого от неё никто не ждёт.",
            quote: "«Ты ведь не бросишь меня опять?»",
            caption: "Авторский образ персонажа",
          },''',
          '''  {
            number: "03",
            name: "Светояра",
            role: "Дочь Прави",
            image: "/images/characters/svetoyara.webp",
            alt: "Образ персонажа Светояра",
            text: "Светлая сущность Прави, сильная даже тогда, когда лишена привычной силы. Её выбор всё чаще оказывается важнее закона.",
            quote: "",
            caption: "",
          },''': '''  {
            number: "03",
            name: "Светояра",
            role: "Дочь Прави",
            image: "/images/characters/svetoyara.webp",
            alt: "Образ персонажа Светояра",
            text: "Дочь Леля, сущность Прави — светлая, но не наивная и не дева в беде. Её путь ведёт от закона и готовых ответов к живому выбору, состраданию и готовности платить за чужую жизнь; к Владимиру её ведут не долг и не жалость.",
            quote: "«Значит, останусь.»",
            caption: "Авторский образ персонажа",
          },''',
          '''  {
            number: "04",
            name: "Огнеяра",
            role: "Ведьма Межи",
            image: "/images/characters/ogneara.webp",
            alt: "Образ персонажа Огнеяра",
            text: "Рыжая ведьма с острым языком и старой болью. Правь её отвергла, Навь приняла, а Явь стала местом, которое приходится защищать.",
            quote: "",
            caption: "",
          },''': '''  {
            number: "04",
            name: "Огнеяра",
            role: "Ведунья, меняющая возраст и лицо",
            image: "/images/characters/ogneara.webp",
            alt: "Образ персонажа Огнеяра",
            text: "Внучка Сварога через смертную линию, выросшая среди богов и ушедшая из Прави. Меняет обличья — девочка, женщина, старуха — и носит в себе огонь, язвительность и старую рану; её костяной гребень, живой дом и Душница знают о ней больше, чем она рассказывает.",
            quote: "«Ты даже не представляешь, что я смогу, если меня достаточно разозлить.»",
            caption: "Авторский образ персонажа",
          },''',
          '''  {
            number: "05",
            name: "Семаргл",
            role: "Огненный бог",
            image: "/images/characters/semargl.webp",
            alt: "Образ персонажа Семаргл",
            text: "Сын Сварога от искры и сын Макоши по теплу. Его огонь хранит границы, а прошлое связано с Огнеярой теснее, чем они оба хотели бы.",
            quote: "",
            caption: "",
          },''': '''  {
            number: "05",
            name: "Семаргл",
            role: "Бог-вестник между Явью и Правью",
            image: "/images/characters/semargl.webp",
            alt: "Образ персонажа Семаргл",
            text: "Сын Сварога, возникший из искры его ковки, и сын Макоши по теплу. Огненный бог, вестник и защитник, умеющий жить на стыке миров; его камни держат древнюю защиту, а одна старая любовь остаётся раной, которую время не сожгло.",
            quote: "«Искра, которая не погасла.»",
            caption: "Авторский образ персонажа",
          },''',
          '''  {
            number: "06",
            name: "Морок",
            role: "Наследник тьмы",
            image: "/images/characters/morok.webp",
            alt: "Образ персонажа Морок",
            text: "Не просто тень и не просто обман. Морок показывает человеку то, что тот сильнее всего желает увидеть, и хочет оставить миру только Правь и Навь.",
            quote: "",
            caption: "",
          },''': '''  {
            number: "06",
            name: "Морок",
            role: "Наследник тьмы",
            image: "/images/characters/morok.webp",
            alt: "Образ персонажа Морок",
            text: "Сын Чернобога и Мораны, наследник крови Рода и претендент на Навь. Он не всегда лжёт: становится тем, кого человек сильнее всего хочет увидеть, и потому опаснее простого обмана; его замысел простирается дальше власти над одним миром.",
            quote: "«Я хочу, чтобы твой стыд принадлежал мне.»",
            caption: "Авторский образ персонажа",
          },'''
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected character block not found:\n' + old[:120])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          audit = Path('MIGRATION_AUDIT.md')
          if audit.exists():
              a = audit.read_text(encoding='utf-8')
              marker = '- Все шесть карточек новой версии сохранены.\n'
              addition = ('- Все шесть карточек новой версии сохранены.\n'
                          '- Невеяна, Светояра, Огнеяра, Семаргл и Морок доведены до той же полноты, что Владимир: у каждого есть развёрнутое описание, характерная строка/цитата и подпись «Авторский образ персонажа».\n'
                          '- Для Невеяны, Огнеяры и Семаргла сохранены ранее утверждённые формулировки карточек: «Та, чья нежность опаснее тьмы», «Ведунья, меняющая возраст и лицо», «Бог-вестник между Явью и Правью».\n')
              if marker in a and 'доведены до той же полноты' not in a:
                  a = a.replace(marker, addition, 1)
                  audit.write_text(a, encoding='utf-8')
          PY

      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit completed character cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/complete-character-cards.yml
          git add app/page.tsx MIGRATION_AUDIT.md
          git commit -m 'feat: complete all hero cards'
          git push
