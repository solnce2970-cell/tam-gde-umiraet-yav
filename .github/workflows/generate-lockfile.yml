name: Generate lockfile

on:
  push:
    branches:
      - agent/pin-dependencies
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pin-dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate dependency lockfile"
          git push origin HEAD:agent/pin-dependencies
