name: Verify Navnik parchment modal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-navnik-modal.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Remove verification workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-navnik-modal.yml
          git commit -m 'chore: remove Navnik verification workflow'
          git push
