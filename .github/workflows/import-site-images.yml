name: Import site images

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-images:
    if: github.event_name != 'push' || (github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(images):'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download images from the old site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://tam-gde-umiraet-yav.inessa1981.chatgpt.site'
          mkdir -p public/images/world public/images/navnik public/images/characters

          fetch() {
            src="$1"
            dst="$2"
            echo "Fetching $src -> $dst"
            curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0' "$BASE/$src" -o "$dst"
            test -s "$dst"
          }

          fetch 'hero.webp' 'public/images/hero.webp'
          fetch 'world/prav.webp' 'public/images/world/prav.webp'
          fetch 'world/yav.webp' 'public/images/world/yav.webp'
          fetch 'world/nav.webp' 'public/images/world/nav.webp'
          fetch 'navnik/auk.webp' 'public/images/navnik/auk.webp'
          fetch 'navnik/vasilisk.webp' 'public/images/navnik/vasilisk.webp'
          fetch 'navnik/mavki.webp' 'public/images/navnik/mavki.webp'
          fetch 'navnik/strzhgun.webp' 'public/images/navnik/strzhgun.webp'
          fetch 'navnik/shishiga.webp' 'public/images/navnik/shishiga.webp'
          fetch 'navnik/pauk.webp' 'public/images/navnik/pauk.webp'
          fetch 'characters/vladimir.webp' 'public/images/characters/vladimir.webp'
          fetch 'characters/neveyana.webp' 'public/images/characters/neveyana.webp'
          fetch 'characters/svetoyara.webp' 'public/images/characters/svetoyara.webp'

          if ! fetch 'characters/ogneara.webp' 'public/images/characters/ogneara.webp'; then
            rm -f 'public/images/characters/ogneara.webp'
            fetch 'characters/ogneyara.webp' 'public/images/characters/ogneara.webp'
          fi

          fetch 'characters/semargl.webp' 'public/images/characters/semargl.webp'
          fetch 'characters/morok.webp' 'public/images/characters/morok.webp'

      - name: Verify image files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            public/images/hero.webp \
            public/images/world/prav.webp public/images/world/yav.webp public/images/world/nav.webp \
            public/images/navnik/auk.webp public/images/navnik/vasilisk.webp public/images/navnik/mavki.webp \
            public/images/navnik/strzhgun.webp public/images/navnik/shishiga.webp public/images/navnik/pauk.webp \
            public/images/characters/vladimir.webp public/images/characters/neveyana.webp \
            public/images/characters/svetoyara.webp public/images/characters/ogneara.webp \
            public/images/characters/semargl.webp public/images/characters/morok.webp; do
            test -s "$f"
            file "$f"
          done

      - name: Switch the site to local images
        shell: python
        run: |
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace('const base = "https://tam-gde-umiraet-yav.inessa1981.chatgpt.site";\n\n', '')
          for folder, names in {
              'world': ['prav', 'yav', 'nav'],
              'navnik': ['auk', 'vasilisk', 'mavki', 'strzhgun', 'shishiga', 'pauk'],
              'characters': ['vladimir', 'neveyana', 'svetoyara', 'ogneara', 'semargl', 'morok'],
          }.items():
              for name in names:
                  text = text.replace(f'`${{base}}/{folder}/{name}.webp`', f'"/images/{folder}/{name}.webp"')
          page.write_text(text, encoding='utf-8')

          css = Path('app/globals.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace("url('https://tam-gde-umiraet-yav.inessa1981.chatgpt.site/hero.webp')", "url('/images/hero.webp')")
          css.write_text(c, encoding='utf-8')

      - name: Commit imported assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-site-images.yml
          git add public/images app/page.tsx app/globals.css
          git commit -m 'chore(images): host site images locally'
          git push
