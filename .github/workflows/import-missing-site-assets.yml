name: Import missing old site assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-missing-site-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download missing assets from ChatGPT Site
        run: |
          set -euo pipefail
          BASE='https://tam-gde-umiraet-yav.inessa1981.chatgpt.site'
          mkdir -p public/images/navnik public/images
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$BASE/hero.webp" -o public/images/hero.webp
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$BASE/navnik/shishiga-shadow.webp" -o public/images/navnik/shishiga-shadow.webp
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0' "$BASE/logo-yav.webp" -o public/images/logo-yav.webp
          test -s public/images/hero.webp
          test -s public/images/navnik/shishiga-shadow.webp
          test -s public/images/logo-yav.webp
          file public/images/hero.webp public/images/navnik/shishiga-shadow.webp public/images/logo-yav.webp

      - name: Commit imported assets and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-missing-site-assets.yml
          git add public/images/hero.webp public/images/navnik/shishiga-shadow.webp public/images/logo-yav.webp
          git commit -m 'chore(images): import remaining assets from old site'
          git push
