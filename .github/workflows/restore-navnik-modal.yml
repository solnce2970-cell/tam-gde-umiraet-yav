name: Restore Navnik parchment modal

on:
  push:
    branches: [navnik-modal-parchment]
    paths:
      - '.github/workflows/restore-navnik-modal.yml'

permissions:
  contents: write

jobs:
  restore-modal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: navnik-modal-parchment
          fetch-depth: 0

      - name: Restore modal behavior and parchment styling
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace('import { useState } from "react";', 'import { useEffect, useState } from "react";', 1)

          start = text.index('function CreatureLeaf')
          end = text.index('\n\nexport default function HomePage()', start)
          modal = r'''function CreatureModal({ creature, onClose }: { creature: Creature; onClose: () => void }) {
  useEffect(() => {
    const onKeyDown = (event: KeyboardEvent) => {
      if (event.key === "Escape") onClose();
    };
    const previousOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onKeyDown);
    return () => {
      document.body.style.overflow = previousOverflow;
      document.removeEventListener("keydown", onKeyDown);
    };
  }, [onClose]);

  return (
    <div className="navnikModalOverlay" role="presentation" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
      <article className="navnikParchmentModal" role="dialog" aria-modal="true" aria-label={`Лист Навника: ${creature.name}`}>
        <button className="navnikModalClose" type="button" onClick={onClose} aria-label="Закрыть запись">×</button>
        <div className="navnikModalScroll">
          <header className="navnikModalHeader">
            <div className="navnikModalPortrait">
              <img src={creature.image} alt={creature.alt} />
            </div>
            <div className="navnikModalTitle">
              <p className="leafLabel">◇ Лист Навника · {creature.number}</p>
              <p className="leafType">Запись о существе</p>
              <h3>{creature.name}</h3>
              <div className="creatureFacts navnikModalFacts">
                <span><small>Принадлежит</small>{creature.realm}</span>
                <span><small>Опасность</small>{creature.danger}</span>
                <span><small>Людям ведомо</small>{creature.known}</span>
              </div>
            </div>
          </header>
          <div className="manuscriptLeaf navnikModalLeaf">
            <span className="initial">{creature.name[0]}</span>
            <div className="leafText">
              {creature.sections.map(([title, sectionText]) => (
                <section key={title}>
                  <h4>{title}</h4>
                  <p>{sectionText}</p>
                  {creature.id === "auk" && title === "Как узнать" && <blockquote className="creatureCall">— Ау-у…</blockquote>}
                </section>
              ))}
            </div>
          </div>
        </div>
      </article>
    </div>
  );
}'''
          text = text[:start] + modal + text[end:]

          text = text.replace(
              'const [openCreatureId, setOpenCreatureId] = useState<string | null>(null);',
              'const [openCreature, setOpenCreature] = useState<Creature | null>(null);',
              1,
          )
          text = text.replace(
              'Нажмите на существо — запись откроется сразу под его изображением.',
              'Нажмите на существо — откроется старый лист Навника.',
              1,
          )

          grid_start = text.index('          <div className="creatureGrid">')
          note_start = text.index('          <p className="navnikNote">', grid_start)
          new_grid = r'''          <div className="creatureGrid">
            {creatures.map((creature) => (
              <article className="creatureEntry" key={creature.id}>
                <button
                  className="creatureCard"
                  type="button"
                  onClick={() => setOpenCreature(creature)}
                  aria-haspopup="dialog"
                  aria-label={`Открыть запись: ${creature.name}`}
                >
                  <div className={`creatureImageWrap ${creature.id === "strzhgun" ? "strzhgunCardImage" : ""}`}>
                    <img src={creature.image} alt={creature.alt} />
                    {creature.altImage && <img className="secondaryCreatureImage" src={creature.altImage} alt={creature.altImageAlt ?? ""} />}
                  </div>
                  <div className="creatureHeading"><span>{creature.number}</span><div><h3>{creature.name}</h3><small>{creature.realm} · {creature.danger}</small></div><b>↗</b></div>
                </button>
              </article>
            ))}
          </div>
'''
          text = text[:grid_start] + new_grid + text[note_start:]

          footer_marker = '      </footer>\n    </main>'
          if footer_marker not in text:
              raise SystemExit('Footer marker not found')
          text = text.replace(
              footer_marker,
              '      </footer>\n\n      {openCreature && <CreatureModal creature={openCreature} onClose={() => setOpenCreature(null)} />}\n    </main>',
              1,
          )
          page.write_text(text, encoding='utf-8')

          css = Path('app/globals.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* NAVNIK_PARCHMENT_MODAL */'
          modal_css = r'''

/* NAVNIK_PARCHMENT_MODAL */
.navnikModalOverlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:rgba(4,6,4,.88);backdrop-filter:blur(5px);animation:navnikFadeIn .18s ease}
.navnikParchmentModal{position:relative;width:min(980px,96vw);height:min(88vh,820px);color:#2d2117;background:#b8864f url('/images/navnik/navnik-parchment.webp') center/100% 100% no-repeat;filter:drop-shadow(0 28px 55px rgba(0,0,0,.75));animation:navnikLeafIn .24s ease;isolation:isolate}
.navnikParchmentModal::after{content:"";position:absolute;inset:8% 7%;z-index:-1;pointer-events:none;background:rgba(205,167,107,.22);filter:blur(18px)}
.navnikModalScroll{height:100%;overflow:auto;padding:72px 86px 64px;scrollbar-width:thin;scrollbar-color:#715034 transparent}
.navnikModalClose{position:absolute;right:42px;top:34px;z-index:4;width:40px;height:40px;border:1px solid rgba(70,39,22,.5);border-radius:50%;background:rgba(84,48,25,.15);color:#4b2d1c;font-size:29px;line-height:1;cursor:pointer;transition:background .2s,transform .2s}
.navnikModalClose:hover{background:rgba(84,48,25,.28);transform:rotate(4deg)}
.navnikModalHeader{display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center;padding-bottom:22px;border-bottom:1px solid rgba(80,49,29,.34)}
.navnikModalPortrait{height:190px;overflow:hidden;border:1px solid rgba(67,38,22,.55);box-shadow:0 8px 18px rgba(62,38,22,.2);background:#5f432f}
.navnikModalPortrait img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.18) saturate(.72) contrast(1.04)}
.navnikModalTitle h3{margin:4px 0 16px;color:#382316;font-size:clamp(38px,5vw,58px);font-weight:400;line-height:.95}
.navnikModalTitle .leafLabel,.navnikModalTitle .leafType{color:#6d4930}
.navnikModalFacts{border-color:rgba(70,43,24,.32)}
.navnikModalFacts span{color:#3b2a20}
.navnikModalLeaf{padding:30px 0 8px;background:transparent;grid-template-columns:58px 1fr}
.navnikModalLeaf .leafText h4{color:#4b2c1c;font-size:20px}
.navnikModalLeaf .leafText p{color:#30241b;font-size:16px;line-height:1.72;text-shadow:0 1px rgba(255,245,220,.2)}
.navnikModalLeaf .initial{color:#71362b}
.navnikModalLeaf .creatureCall{color:#5a3426}
@keyframes navnikFadeIn{from{opacity:0}to{opacity:1}}
@keyframes navnikLeafIn{from{opacity:0;transform:scale(.965) translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:720px){.navnikModalOverlay{padding:8px}.navnikParchmentModal{width:98vw;height:92vh;background-size:100% 100%}.navnikModalScroll{padding:58px 38px 44px}.navnikModalClose{right:24px;top:22px;width:36px;height:36px}.navnikModalHeader{grid-template-columns:1fr;gap:16px}.navnikModalPortrait{height:220px;width:72%;margin:0 auto}.navnikModalTitle{text-align:center}.navnikModalFacts{text-align:left;grid-template-columns:1fr}.navnikModalLeaf{grid-template-columns:40px 1fr}.navnikModalLeaf .initial{font-size:52px}.navnikModalLeaf .leafText p{font-size:15px}}
'''
          if marker not in styles:
              css.write_text(styles + modal_css, encoding='utf-8')
          PY

      - name: Verify and build
        run: |
          test -s public/images/navnik/navnik-parchment.webp
          grep -q 'navnikParchmentModal' app/page.tsx
          grep -q 'navnik-parchment.webp' app/globals.css
          npm install --no-audit --no-fund
          npm run build

      - name: Commit restored modal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-navnik-modal.yml
          git add app/page.tsx app/globals.css
          git commit -m 'feat(navnik): restore parchment modal'
          git push origin navnik-modal-parchment
