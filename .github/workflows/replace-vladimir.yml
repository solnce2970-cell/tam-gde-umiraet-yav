name: Replace Vladimir image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded image
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/vladimir.part1 .tmp/vladimir.part2 .tmp/vladimir.part3 .tmp/vladimir.part4 .tmp/vladimir.part5 | base64 --decode > public/images/characters/vladimir.webp
          test -s public/images/characters/vladimir.webp
          file public/images/characters/vladimir.webp

      - name: Commit replacement and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/characters/vladimir.webp
          git rm .tmp/vladimir.part1 .tmp/vladimir.part2 .tmp/vladimir.part3 .tmp/vladimir.part4 .tmp/vladimir.part5
          git rm .github/workflows/replace-vladimir.yml
          git commit -m 'feat(images): replace Vladimir portrait'
          git push
