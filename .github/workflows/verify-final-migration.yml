name: Verify final migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-final-migration.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no runtime dependency on old site
        run: |
          set -euo pipefail
          if grep -R -F 'tam-gde-umiraet-yav.inessa1981.chatgpt.site' app --exclude-dir='.next'; then
            echo 'Old ChatGPT Site dependency remains in app code' >&2
            exit 1
          fi
          test -s public/images/hero.webp
          test -s public/images/logo-yav.webp
          test -s public/images/navnik/shishiga-shadow.webp
          test -s public/images/characters/vladimir.webp
          test -s public/music/oy-tonka-mezha.mp3
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Remove one-shot verification workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-final-migration.yml
          git commit -m 'chore: finish migration verification'
          git push
